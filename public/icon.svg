<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bell-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" />

  <!-- Bell Ring Radiating Waves -->
  <path d="M120,180 A170,170 0 0,1 392,180" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 20" opacity="0.6" />
  <path d="M80,180 A210,210 0 0,1 432,180" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-dasharray="20 28" opacity="0.4" />

  <!-- Golden Bell Group -->
  <g filter="url(#shadow)">
    <!-- Top hanger loop -->
    <path d="M256,90 C234,90 220,104 220,126 L220,140 L292,140 L292,126 C292,104 278,90 256,90 Z" fill="url(#bell-gold)" />
    <circle cx="256" cy="115" r="10" fill="#1e3a8a" />

    <!-- Main Bell Body -->
    <path d="M256,136 C200,136 174,185 174,270 C174,320 150,345 136,365 C130,374 136,386 148,386 L364,386 C376,386 382,374 376,365 C362,345 338,320 338,270 C338,185 312,136 256,136 Z" fill="url(#bell-gold)" />

    <!-- Bell rim highlight -->
    <path d="M140,376 C170,392 342,392 372,376" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" />

    <!-- Bell Clapper -->
    <path d="M236,386 C236,412 245,422 256,422 C267,422 276,412 276,386 Z" fill="#b45309" />
    <circle cx="256" cy="406" r="22" fill="url(#bell-gold)" />
  </g>

  <!-- Sound Waves (Left & Right) -->
  <path d="M120,260 C100,280 100,310 120,330" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
  <path d="M90,240 C60,270 60,330 90,360" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

  <path d="M392,260 C412,280 412,310 392,330" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
  <path d="M422,240 C452,270 452,330 422,360" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

  <!-- Badge Text SMKN 1 MOILONG -->
  <rect x="76" y="442" width="360" height="42" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#3b82f6" stroke-width="2" />
  <text x="256" y="469" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SMKN 1 MOILONG</text>
</svg>
