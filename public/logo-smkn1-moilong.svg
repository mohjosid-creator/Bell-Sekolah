<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp drop-shadow -->
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <!-- Text Paths for curved text -->
    <path id="top-curve" d="M 75 190 A 210 190 0 0 1 425 190" fill="none" />
    <path id="bottom-curve" d="M 100 375 A 190 140 0 0 0 400 375" fill="none" />
  </defs>

  <!-- SHIELD BASE -->
  <g filter="url(#logo-shadow)">
    <!-- Outer Dark Border -->
    <polygon points="250,15 480,175 405,490 95,490 20,175" fill="#1e293b" stroke="#1e293b" stroke-width="4" stroke-linejoin="round" />
    <!-- White Intermediate Border -->
    <polygon points="250,22 472,177 399,482 101,482 28,177" fill="#ffffff" />
    <!-- Main Sky Blue Shield -->
    <polygon points="250,30 462,180 392,474 108,474 38,180" fill="#46aee8" />
  </g>

  <!-- TOP CURVED TEXT: SMK NEGERI 1 MOILONG -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="25" letter-spacing="3.5" text-anchor="middle">
    <textPath href="#top-curve" startOffset="50%">SMK NEGERI 1 MOILONG</textPath>
  </text>

  <!-- GOLDEN STAR AT TOP -->
  <polygon points="250,118 256,136 275,136 260,147 266,165 250,154 234,165 240,147 225,136 244,136" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" />

  <!-- CIRCULAR WREATH (LEFT: COTTON, RIGHT: RICE/PADI) -->
  <g id="wreath">
    <!-- Left Cotton (Kapas) Branch -->
    <path d="M 230,148 C 170,165 130,220 132,295 C 133,355 170,410 225,435" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" />
    <!-- Cotton leaves and blooms -->
    <!-- Bloom 1 -->
    <circle cx="195" cy="165" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 188,170 C 192,160 200,160 204,170" fill="none" stroke="#15803d" stroke-width="3" />
    <!-- Bloom 2 -->
    <circle cx="160" cy="195" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 152,200 C 158,188 168,188 172,200" fill="none" stroke="#15803d" stroke-width="3" />
    <!-- Bloom 3 -->
    <circle cx="140" cy="238" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 132,242 C 138,230 148,230 152,242" fill="none" stroke="#15803d" stroke-width="3" />
    <!-- Bloom 4 -->
    <circle cx="134" cy="285" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 126,290 C 132,278 142,278 146,290" fill="none" stroke="#15803d" stroke-width="3" />
    <!-- Bloom 5 -->
    <circle cx="142" cy="335" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 135,340 C 140,328 150,328 155,340" fill="none" stroke="#15803d" stroke-width="3" />
    <!-- Bloom 6 -->
    <circle cx="165" cy="380" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 158,385 C 163,374 173,374 178,385" fill="none" stroke="#15803d" stroke-width="3" />
    <!-- Bloom 7 -->
    <circle cx="198" cy="415" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />

    <!-- Right Rice (Padi) Branch -->
    <path d="M 270,148 C 330,165 370,220 368,295 C 367,355 330,410 275,435" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <!-- Golden Rice Grains -->
    <!-- Grains top to bottom -->
    <g fill="#fbbf24" stroke="#b45309" stroke-width="1.5">
      <ellipse cx="295" cy="160" rx="6" ry="11" transform="rotate(30 295 160)" />
      <ellipse cx="310" cy="172" rx="6" ry="11" transform="rotate(40 310 172)" />
      <ellipse cx="330" cy="192" rx="6" ry="11" transform="rotate(50 330 192)" />
      <ellipse cx="346" cy="214" rx="6" ry="11" transform="rotate(60 346 214)" />
      <ellipse cx="358" cy="240" rx="6" ry="11" transform="rotate(70 358 240)" />
      <ellipse cx="364" cy="268" rx="6" ry="11" transform="rotate(80 364 268)" />
      <ellipse cx="365" cy="296" rx="6" ry="11" transform="rotate(90 365 296)" />
      <ellipse cx="360" cy="324" rx="6" ry="11" transform="rotate(100 360 324)" />
      <ellipse cx="350" cy="350" rx="6" ry="11" transform="rotate(115 350 350)" />
      <ellipse cx="334" cy="375" rx="6" ry="11" transform="rotate(130 334 375)" />
      <ellipse cx="312" cy="398" rx="6" ry="11" transform="rotate(145 312 398)" />
      <ellipse cx="286" cy="418" rx="6" ry="11" transform="rotate(160 286 418)" />
    </g>
  </g>

  <!-- CENTER EMBLEM: WINGS, COLUMN, BOOK, HANDS -->
  <g id="center-emblem">
    <!-- GOLDEN WINGS SPREADING -->
    <!-- Left Wing -->
    <path d="M 245,260 C 210,210 185,175 190,175 C 198,175 208,215 220,240 C 190,195 178,210 182,225 C 188,245 210,270 230,285 C 185,250 180,270 190,285 C 205,302 235,308 245,310 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <!-- Right Wing -->
    <path d="M 255,260 C 290,210 315,175 310,175 C 302,175 292,215 280,240 C 310,195 322,210 318,225 C 312,245 290,270 270,285 C 315,250 320,270 310,285 C 295,302 265,308 255,310 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />

    <!-- CENTRAL TORCH / PEN PILLAR -->
    <path d="M 246,182 L 254,182 L 253,275 L 247,275 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <ellipse cx="250" cy="180" rx="4" ry="7" fill="#b45309" />

    <!-- OPEN BOOK -->
    <!-- Pages Base -->
    <path d="M 250,285 C 225,275 190,280 182,282 L 182,342 C 192,340 225,335 250,345 C 275,335 308,340 318,342 L 318,282 C 310,280 275,275 250,285 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
    <!-- Center Spine line -->
    <line x1="250" y1="285" x2="250" y2="345" stroke="#0f172a" stroke-width="3" />
    <!-- Book pages details -->
    <path d="M 190,296 C 210,292 235,296 244,302" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 190,310 C 210,306 235,310 244,316" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 190,324 C 210,320 235,324 244,330" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 310,296 C 290,292 265,296 256,302" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 310,310 C 290,306 265,310 256,316" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 310,324 C 290,320 265,324 256,330" fill="none" stroke="#64748b" stroke-width="1.5" />

    <!-- GOLDEN SUPPORTING HANDS -->
    <g fill="#facc15" stroke="#ca8a04" stroke-width="2.5" stroke-linejoin="round">
      <!-- Left Hand -->
      <path d="M 202,342 L 235,342 L 246,375 L 246,420 L 230,420 L 230,375 L 212,375 L 202,355 Z" />
      <!-- Right Hand -->
      <path d="M 298,342 L 265,342 L 254,375 L 254,420 L 270,420 L 270,375 L 288,375 L 298,355 Z" />
    </g>
  </g>

  <!-- BOTTOM CURVED TEXT: KABUPATEN BANGGAI -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="24" letter-spacing="4" text-anchor="middle">
    <textPath href="#bottom-curve" startOffset="50%">KABUPATEN BANGGAI</textPath>
  </text>
</svg>